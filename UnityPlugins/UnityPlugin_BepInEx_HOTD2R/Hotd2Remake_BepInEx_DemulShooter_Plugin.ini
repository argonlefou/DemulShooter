[INPUT_KEYS]
;Set Keycode (decimal value) for each key. See following link for the value list:
;https://gist.github.com/Extremelyd1/4bcd495e21453ed9e1dffa27f6ba5f69
;START is used to join a Multiplayer campaign (P2), to continue after death and to validate the READY screen
P1_START=49
P2_START=50
;EXIT key to quit the game. 0 = disabled, as Escape (27) is used by the game for its pause menu
EXIT=0

[GAME]
;Use the game's own "control panel" setting to give unlimited continues to both players (0 = disabled, 1 = enabled)
UNLIMITED_CONTINUES=0
